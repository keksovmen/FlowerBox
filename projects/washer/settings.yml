# settings.yml
project: washer
name: Washer
version: 0.0.1
settings:
  - name: Url
    type: std::string
    default: "http://192.168.0.111:8080"
    key: http_url
  - name: BounceTimeMs
    type: int
    default: 50
    key: bounce
    min: 0
    max: 500
  - name: MqttId
    type: int
    default: 0
    key: l_mqtt_id
    min: 0
    max: 4096
  - name: Ip
    type: std::string
    default: 192.168.0.111
    key: mq_ip
  - name: Port
    type: int
    default: 8081
    key: mq_port
    min: 0
    max: 65535
  - name: BlinkPeriodMs
    type: int
    default: 500
    key: blink_ms
    min: 0
    max: 65535