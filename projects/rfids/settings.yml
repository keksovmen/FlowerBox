# settings.yml
project: rfids
name: RfidArray
version: 0.0.1
settings:
  - name: Url
    type: std::string
    default: "http://192.168.0.111:8080"
    key: http_url
  - name: Log
    type: int
    default: 1
    key: log_en
    min: 0
    max: 1
  - name: ReadTimeMs
    type: int
    default: 160
    key: read_ms
    min: 100
    max: 300