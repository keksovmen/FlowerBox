<!DOCTYPE html>
<html>

<head>
	<title>Переключатели</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/html/test_style.css">
</head>

<body>
	<div class="container">
		<!-- Header with back button -->
		<div class="header-bar">
			<button class="btn-back" onclick="history.back()">&larr; Back</button>
			<h1 class="header-title">Список переключателей</h1>
		</div>

		<div class="list-container">
			{{ begin count }}
			<div class="list-item" onclick="loadPage('/html/properties.html?source=switch&id={{ puta id[i] }}')">
				<div class="item-name">{{ puta name[i] }}</div>
				<div class="item-description">{{ puta description[i] }}</div>
				<div class="item-value">{{ puta value[i] }}</div>
			</div>
			{{ end }}
		</div>

		<div id="loading-overlay" class="loading-overlay" style="display: none;">
			<div class="loading-spinner"></div>
		</div>
	</div>

	<script src="/html/nav.js"></script>
</body>

</html>
