<!DOCTYPE html>
<html>

<head>
	<title>Меню обновления</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="/html/test_style.css">
</head>

<body>
	<div class="container">
		<!-- Header with back button -->
		<div class="header-bar">
			<button class="btn-back" onclick="history.back()">&larr; Back</button>
			<h1 class="header-title">Обновление ПО</h1>
		</div>

		<h2 class="page-header" style="font-size:18px; margin-top:10px;">Прошивка</h2>
		<div class="list-container">
			<form class="list-container" method="post" enctype="multipart/form-data" action="/update">
				<input type="file" name="file" class="btn" style="display:block; width:100%; margin-bottom:10px;">
				<input type="submit" class="btn" value="Отправить">
			</form>
		</div>

		<h2 class="page-header" style="font-size:18px; margin-top:20px;">SPIFFS</h2>
		<div class="list-container">
			<form class="list-container" method="post" enctype="multipart/form-data" action="/update_spiff">
				<input type="file" name="file" class="btn" style="display:block; width:100%; margin-bottom:10px;">
				<input type="submit" class="btn" value="Отправить">
			</form>
		</div>
	</div>
</body>

</html>
